[project]
name = "arip-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "sqlalchemy==2.0.41",
  "psycopg[binary]==3.2.9",
  "alembic==1.16.4",
  "openpyxl==3.1.5",
  "python-multipart==0.0.20",
  "celery==5.5.3",
  "redis==6.2.0",
  "boto3==1.39.4",
  "httpx==0.28.1",
  "openai>=1.93.0",
  "PyJWT==2.10.1",
  "passlib[bcrypt]==1.7.4",
  "pypdf==5.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
